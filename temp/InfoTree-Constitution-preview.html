lapsed, to arrange for the Storting to be summoned. Article 47 The supervision of the education of the King during his minority should, if both his parents are dead and neither of them has left any writ\u0002ten directions thereon, be determined by the Storting. Article 48 If the royal line has died out, and no successor to the throne has been designated, then a new Queen or King shall be chosen by the Storting. Meanwhile, the executive power shall be exercised in accordance with Article 40. C.  Rights of Citizens and The Legislative Power Article 49 The people exercise the legislative power through the Storting. The Members of the Storting are elected through free and secret elections. Article 50 Those entitled to vote in elections to the Storting are Norwegian citi\u0002zens, men and women, who, at the latest in the year when the election is held, have completed their eighteenth year.  The extent, however, to which Norwegian citizens who on election day are resident outside the realm but who satisfy the aforementioned conditions are entitled to vote shall be determined by law. Rules may be laid down by law concerning the right to vote of persons otherwise entitled to vote who on election day are manifestly suffering from a seriously weakened mental state or a reduced level of conscious\u0002ness. Article 51 The rules on the keeping of the electoral register and on the registra\u0002tion in the register of persons entitled to vote shall be determined by law. Article 52 (Repealed) Article 53 The right to vote is lost by persons: a) sentenced for criminal offences, in accordance with the relevant pro\u0002visions laid down by law; b) entering the service of a foreign power without the consent of the Government. Article 54 Elections shall be held every fourth year. They shall be concluded by the end of September. Article 55 Elections shall be conducted in the manner prescribed by law. Dis\u0002putes regarding the right to vote shall be settled by the Election Commis\u0002sion, whose decision may be appealed to the Storting. Article 56 (Repealed) Article 57 The number of Members of the Storting shall be one hundred and sixty-nine. The realm is divided into nineteen constituencies. One hundred and fifty of the Members of the Storting are elected as representatives of constituencies and the remaining nineteen Members are elected as members at large. Each constituency shall have one seat at large. The number of Members of the Storting to be chosen from each con\u0002stituency is determined on the basis of a calculation of the ratio between the number of inhabitants and surface area of each constituency and the number of inhabitants and surface area of the entire realm, in which each inhabitant counts as one point and each square kilometre counts as 1.8 points. This calculation shall be made every eighth year. Specific provisions on the division of the realm into constituencies and on the allotment of seats in the Storting to the constituencies shall be determined by law. Article 58 The polls shall be held separately for each municipality. At the polls votes shall be cast directly for representatives to the Storting, together with their proxies, to represent the entire constituency. Article 59 The election of representatives of constituencies is based on propor\u0002tional representation and the seats are distributed among the political par\u0002ties in accordance with the following rules. The total number of votes cast for each party within each separate constituency is divided by 1.4, 3, 5, 7 and so on until the number of votes cast is divided as many times as the number of seats that the party in ques\u0002tion may be expected to obtain. The party which in accordance with the foregoing obtains the largest quotient is allotted the first seat, while the second seat is allotted to the party with the second largest quotient, and so on until all the seats are distributed.  List alliances are not permitted. The seats at large are distributed among the parties taking part in such distribution on the basis of the relation between the total number of votes cast for the individual parties in the entire realm in order to achieve the highest possible degree of proportionality among the parties. The total number of seats in the Storting to be held by each party is determined by applying the rules concerning the distribution of constituency seats corre\u0002spondingly to the entire realm and to the parties taking part in the distri\u0002bution of the seats at large. The parties are then allotted so many seats at large that these, together with the constituency seats already allotted, cor\u0002respond to the number of seats in the Storting to which the party in ques\u0002tion is entitled in accordance with the foregoing. If a party has already through the distribution of constituency seats obtained a greater number of seats than it is entitled to in accordance with the foregoing, a new distri\u0002bution of the seats at large shall be carried out exclusively among the other parties, in such a way that no account is taken of the number of votes cast for and constituency seats obtained by the said party. No party may be allotted a seat at large unless it has received at least four per cent of the total number of votes cast in the entire realm. Specific provisions concerning the distribution among the constitu\u0002encies of the seats at large allotted to the parties shall be determined by law. Article 60 Whether and in what manner those entitled to vote may deliver their ballot papers without personal attendance at the polls shall be determined by law. Article 61 No one may be elected as a Member of the Storting unless he or she is entitled to vote. Article 62 Officials who are employed in government ministries, except however state secretaries and political advisers, may not be elected as representa\u0002tives. The same applies to Members of the Supreme Court and officials employed in the diplomatic or consular services. Members of the Council of State may not attend meetings of the Stor\u0002ting as representatives while holding a seat in the Council of State. Nor may state secretaries attend as representatives while holding their offices, and political advisers in government ministries may not attend meetings of the Storting as long as they hold their positions. Article 63 It is the duty of anyone who is elected as a Member of the Storting to accept such election, unless they: a) are elected outside the constituency in which he is entitled to vote. b) have as a Member attended all the sessions of the Storting following the previous election. d) are a member of a political party and are elected on a list of candidates which has not been issued by that party. Rules for the time within which and the manner in which anyone who has the right to refuse election shall assert this right shall be prescribed by law. It shall similarly be prescribed by law by what date and in which man\u0002ner anyone who is elected as representative for two or more constituencies shall state which election he will accept. Article 64 The Members elected shall be furnished with credentials, the validity of which shall be adjudged by the Storting. Article 65 Every Member and Substitute Member called to the Storting shall be entitled to receive from the Treasury such reimbursement as is prescribed by law for travelling expenses to and from the Storting, and from the Stor\u0002ting to his home and back again during vacations lasting at least fourteen days.  He shall further be entitled to remuneration, likewise prescribed by law, for attending the Storting. Article 66 Members on their way to and from the Storting, as well as during their attendance there, shall be exempt from personal arrest, unless they are apprehended in public crimes. Nor may they be called to account outside the meetings of the Storting for opinions expressed there. Everyone shall be bound to conform to the rules of procedure therein adopted. Article 67 The Members elected in the aforesaid manner shall constitute the Storting of the Kingdom of Norway. Article 68 The Storting shall as a rule assemble on the first weekday in October every year in the capital of the realm, unless the King, by reason of extraor\u0002dinary circumstances, such as hostile invasion or infectious disease, desig\u0002nates another town in the realm for the purpose. Such a decision must be publicly announced in good time. Article 69 When the Storting is not assembled, it may be summoned by the King if he finds it necessary. Article 70 (Repealed) Article 71 The Members of the Storting function as such for four successive years. Article 72 (Repealed) Article 73 The Storting appoints a President, five Vice Presidents and two Secre\u0002taries. The Storting may not hold a sitting unless at least half of its Mem\u0002bers are present. However, Bills concerning amendments to the Constitu\u0002tion may not be dealt with unless at least two thirds of the Members of the Storting are present. Article 74 As soon as the Storting is constituted, the King, or whoever he appoints for the purpose, shall open its proceedings with a speech, in which he shall inform it of the state of the realm and of the issues to which he particularly desires to call the attention of the Storting. No deliberations may take place in the presence of the King. When the proceedings of the Storting have been opened, the Prime Minister and the Members of the Council of State have the right to attend the Storting and, like its Members, although without voting, to take part in any proceedings conducted in open session, while in matters discussed in closed session only insofar as permitted by the Storting. Article 75 It devolves upon the Storting: a) to enact and repeal laws; to impose taxes, duties, customs and other public charges, which shall not, however, remain operative beyond 31 December of the succeeding year, unless they are expressly renewed by a new Storting; b) to raise loans in the name of the realm; c) to supervise the monetary system of the realm; d) to appropriate the moneys necessary to meet government expendi\u0002ture; e) to decide how much shall be paid annually to the King for the Royal Household, and to determine the Royal Family’s appanage, which may not, however, consist of real property; f) to have submitted to it the records of the Council of State, and all pub\u0002lic reports and documents; g) to have communicated to it the treaties which the King, on behalf of the State, has concluded with foreign powers; h) to have the right to require anyone, the King and the Royal Family ex\u0002cepted, to appear before it on matters of State; the exception does not, however, apply to the Royal Princes and Princesses if they hold any public office; i) to review the provisional lists of salaries and pensions and to make therein such alterations as it deems necessary; k) to appoint five auditors, who shall annually examine the State Ac\u0002counts and publish extracts of the same in print, for which purpose the Accounts shall be submitted to the auditors within six months of the end of the year for which the appropriations of the Storting have been made, and to adopt provisions concerning the procedure for au\u0002thorising the accounts of government accounting officials; l) to appoint a person, not a Member of the Storting, in a manner pre\u0002scribed by law, to supervise the public administration and all who work in its service, to assure that no injustice is done against the indi\u0002vidual citizen; m) to naturalise aliens. Article 76 Every Bill shall first be proposed in the Storting, either by one of its own Members, or by the Government through a Member of the Council of State.  Once the Bill is passed there, a new deliberation is to take place in the Storting, which either approves or rejects it. In the latter case the Bill, with the comments appended by the Storting, shall again be taken into consid\u0002eration by the Storting, which either shelves the Bill or approves it with the said comments.  Between each such deliberation there shall be an interval of at least three days. Article 77 When a Bill has been approved by the Storting in two consecutive sit\u0002tings, it is sent to the King with a request that it may receive the Royal Assent. Article 78 If the King assents to the Bill, he appends his signature, whereby it becomes law. If he does not assent to it, he returns it to the Storting with a statement that he does not for the time being find it expedient to give his assent. In that case the Bill must not again be submitted to the King by the Storting then assembled. Article 79 If a Bill has been passed unaltered by two sessions of the Storting, con\u0002stituted after two separate successive elections and separated from each other by at least two intervening sessions of the Storting, without a diver\u0002gent Bill having been passed by any Storting in the period between the first and last adoption, and it is then submitted to the King with a petition that His Majesty shall not refuse his assent to a Bill which, after the most mature deliberation, the Storting considers to be beneficial, it shall become law even if the Royal Assent is not accorded before the Storting goes into recess. Article 80 The Storting shall remain in session as long as it deems it necessary and shall terminate its proceedings when it has concluded its business.  In accordance with the rules of procedure adopted by the Storting, the proceedings may be resumed, but they shall terminate not later than the last weekday in the month of September.  Within this time the King shall communicate his decision with regard to the Bills that have not already been decided, by either confirming or rejecting them. All those which he does not expressly accept are deemed to have been rejected by him. Article 81 All Acts (with the exception of those mentioned in Article 79) are drawn up in the name of the King, under the Seal of the Realm of Norway, and in the following terms: “We, X, make it publicly known: that the deci\u0002sion of the Storting of the date stated has been laid before Us: (here follows the decision). In consequence whereof We have assented to and con\u0002firmed, as We hereby do assent to and confirm the same as Law under Our Hand and the Seal of the Realm.” Article 82 The Government is to provide the Storting with all information that is necessary for the proceedings on the matters it submits. No Member of the Council of State may submit incorrect or misleading information to the Storting or its bodies. Article 83 The Storting may obtain the opinion of the Supreme Court on points of law. Article 84 The Storting shall meet in open session, and its proceedings shall be published in print, except in those cases where a majority decides to the contrary. Article 85 Any person who obeys an order the purpose of which is to disturb the liberty and security of the Storting is thereby guilty of treason against the country. D.  The Judicial Power Article 86 The Court of Impeachment pronounces judgment in the first and last instance in such proceedings as are brought by the Storting against Mem\u0002bers of the Council of State or of the Supreme Court or of the Storting for criminal or other unlawful conduct in cases where they have breached their constitutional obligations. The specific rules concerning indictment by the Storting in accordance with this Article shall be determined by law. However, the limitation period for the institution of indictment proceedings before the Court of Impeachment may not be set at less than 15 years. The judges of the Court of Impeachment comprise six Members elected by the Storting and the five longest-serving, permanently appointed Members of the Supreme Court, including the President of the Supreme Court. The Storting elects the Members and their deputies for a period of six years. A Member of the Council of State or of the Storting may not be elected as a Member of the Court of Impeachment. In the Court of Impeachment the President of the Supreme Court shall preside. Any person sitting in the Court of Impeachment who has been elected by the Storting shall not lose his seat in the Court if the period for which he is elected expires before the Court of Impeachment has concluded the pro\u0002ceedings in the case. Nor shall a Justice of the Supreme Court who is a Member of the Court of Impeachment lose his seat in the Court, even if he resigns as a Member of the Supreme Court. Article 87 Specific provisions as to the composition of the Court of Impeachment and its procedures shall be laid down by law. Article 88 The Supreme Court pronounces judgment in the final instance. Never\u0002theless, limitations on the right to bring a case before the Supreme Court may be prescribed by law. The Supreme Court shall consist of a President and at least four other Members. Article 89 (Repealed) Article 90 The judgments of the Supreme Court may in no case be appealed. Article 91 No one may be appointed a Member of the Supreme Court before reaching 30 years of age. E. Human Rights Article 92 The authorities of the State shall respect and ensure human rights as they are expressed in this Constitution and in the treaties concerning human rights that are binding for Norway. Article 93 Every human being has the right to life. No one may be sentenced to death. No one may be subjected to torture or other inhuman or degrading treatment or punishment. No one shall be held in slavery or required to perform forced labour. The authorities of the State shall protect the right to life and oppose torture, slavery, forced labour and other forms of inhuman or degrading treatment. Article 94 No one may be taken into custody or otherwise be deprived of their liberty except in the cases determined by law and in the manner pre\u0002scribed by law. Deprivation of liberty must be necessary and must not con\u0002stitute a disproportionate infringement. Persons arrested shall as soon as possible be brought before a court. Others who have been deprived of their liberty have the right to bring their deprivation of liberty before a court without unjustified delay. Those responsible for the unwarranted arrest or illegal detention of a person shall be answerable to the person concerned. Article 95 Everyone has the right to have their case tried by an independent and impartial court within reasonable time. Legal proceedings shall be fair and public. The court may however conduct proceedings in camera if consider\u0002ations of the privacy of the parties concerned or if weighty and significant public interests necessitate this. The authorities of the state shall ensure the independence and impar\u0002tiality of the courts and the members of the judiciary. Article 96 No one may be sentenced except according to law, or be punished except after a court judgment. Everyone has the right to be presumed innocent until proved guilty according to law. No one may be sentenced to surrender property or accumulated wealth unless the assets have been used to commit or are profits from a criminal act. Article 97 No law must be given retroactive effect. Article 98 All people are equal under the law. No human being must be subject to unfair or disproportionate differ\u0002ential treatment. Article 99 (Repealed) Article 100 There shall be freedom of expression. No one may be held liable in law for having imparted or received information, ideas or messages unless this can be justified in relation to the grounds for freedom of expression, which are the seeking of truth, the pro\u0002motion of democracy and the individual’s freedom to form opinions. Such legal liability shall be prescribed by law.  Everyone shall be free to speak their mind frankly on the administra\u0002tion of the State and on any other subject whatsoever. Clearly defined limi\u0002tations to this right may only be imposed when particularly weighty con\u0002siderations so justify in relation to the grounds for freedom of expression. Prior censorship and other preventive measures may not be applied unless so required in order to protect children and young persons from the harmful influence of moving pictures. Censorship of letters may only be imposed in institutions. Everyone has a right of access to documents of the State and munici\u0002palities and a right to follow the proceedings of the courts and democrati\u0002cally elected bodies. Limitations to this right may be prescribed by law to protect the privacy of the individual or for other weighty reasons.  The authorities of the state shall create conditions that facilitate open and enlightened public discourse. Article 101 Everyone has the right to form, join and leave associations, including trade unions and political parties. All people may meet in peaceful assemblies and demonstrations. The Government is not entitled to employ military force against citi\u0002zens of the state, except in accordance with the law, unless an assembly dis\u0002turbs the public peace and does not immediately disperse after the articles of the statute book relating to riots have been read out clearly three times by the civil authority. Article 102 Everyone has the right to the respect of their privacy and family life, their home and their communication. Search of private homes shall not be made except in criminal cases. The authorities of the state shall ensure the protection of personal integrity. Article 103 (Repealed) Article 104 Children have the right to respect for their human dignity. They have the right to be heard in questions that concern them, and due weight shall be attached to their views in accordance with their age and development. For actions and decisions that affect children, the best interests of the child shall be a fundamental consideration. Children have the right to protection of their personal integrity. The authorities of the state shall create conditions that facilitate the child’s development, including ensuring that the child is provided with the neces\u0002sary economic, social and health security, preferably within their own fam\u0002ily. Article 105 If the welfare of the state requires that any person shall surrender their movable or immovable property for the public use, they shall receive full compensation from the Treasury. Article 106 Everyone who resides legally in the realm may move freely within the borders of the realm and choose their place of residence there. No one may be denied the right to leave the realm, unless so required out of consideration for effective legal proceedings or the performance of military service. Norwegian citizens may not be refused entry into the realm. Article 107 Article 108 The authorities of the state shall create conditions enabling the Sami people to preserve and develop its language, culture and way of life. Article 109 Everyone has the right to education. Children have the right to receive basic education. The education shall safeguard the individual’s abilities and needs, and promote respect for democracy, the rule of law and human rights. The authorities of the state shall ensure access to upper secondary edu\u0002cation and equal opportunities for higher education on the basis of qualifi\u0002cations. Article 110 The authorities of the state shall create conditions under which every person capable of work is able to earn a living through their work or enter\u0002prise. Those who cannot themselves provide for their own subsistence have the right to support from the state. Specific provisions concerning the right of employees to co-determi\u0002nation at their work place shall be laid down by law. Article 111 Article 112 Every person has the right to an environment that is conducive to health and to a natural environment whose productivity and diversity are maintained. Natural resources shall be managed on the basis of compre\u0002hensive long-term considerations which will safeguard this right for future generations as well. In order to safeguard their right in accordance with the foregoing para\u0002graph, citizens are entitled to information on the state of the natural envi\u0002ronment and on the effects of any encroachment on nature that is planned or carried out. The authorities of the state shall take measures for the implementa\u0002tion of these principles. Article 113 Infringement of the authorities against the individual must be founded on the law. F.  General Provisions Article 114 To senior official posts in the State may be appointed only Norwegian citizens, men or women, who speak the language of the country, and who: a) either were born in the realm of parents who were then Norwe\u0002gian subjects; b) or were born in a foreign country of Norwegian parents who were not at that time subjects of another State; c) or hereafter have resided for ten years in the realm; d) or have been naturalised by the Storting. Others may, however, be appointed as teachers at universities and institutions of higher learning, as medical practitioners and as consuls in places abroad. Article 115 In order to safeguard international peace and security or to promote the international rule of law and cooperation, the Storting may, by a three\u0002fourths majority, consent that an international organisation to which Nor\u0002way belongs or will belong shall have the right, within specified fields, to exercise powers which in accordance with this Constitution are normally vested in the authorities of the state, although not the power to alter this Constitution. For the Storting to grant such consent, at least two thirds of its Members shall be present, as required for proceedings for amending the Constitution. The provisions of this Article do not apply in cases of membership in an international organisation whose decisions only have application for Norway exclusively under international law. Article 116 The purchase money, as well as the revenues of the landed property constituting ecclesiastical benefices, shall be applied solely to the benefit of the clergy and to the promotion of education. The property of charitable foundations shall be applied solely to the benefit of the foundations them\u0002selves. Article 117 Allodial right and the right of primogeniture shall not be abolished. The specific conditions under which these rights shall continue for the greatest benefit of the state and to the best advantage of the rural popula\u0002tion shall be determined by the first or second subsequent Storting. Article 118 No earldoms, baronies, entailed estates or fidei commissa may be cre\u0002ated in the future. Article 119 As a general rule every citizen of the State is equally bound to serve in the defence of the country for a specific period, irrespective of birth or for\u0002tune. The application of this principle, and the restrictions to which it shall be subject, shall be determined by law. Article 120 The form and colours of the flag of Norway shall be determined by law. Article 121 If experience shows that any part of this Constitution of the Kingdom of Norway ought to be amended, the proposal to this effect shall be sub\u0002mitted to the first, second or third Storting after a new parliamentary elec\u0002tion and be publicly announced in print. But it shall be left to the first, sec\u0002ond or third Storting after the following parliamentary election to decide whether or not the proposed amendment shall be adopted. Such an amendment must never, however, contradict the principles embodied in this Constitution, but solely relate to modifications of particular provi\u0002sions which do not alter the spirit of the Constitution, and two thirds of the Storting must agree with such an amendment. An amendment to the Constitution adopted in the manner aforesaid shall be signed by the President and the Secretary of the Storting, and shall be sent to the King for public announcement in print as an applicable pro\u0002vision of the Constitution of the Kingdom of Norway."}}</script>
    <script>
        const data = JSON.parse(document.getElementById('tree-data').textContent);
        const root = data.root;
        const treeRoot = document.getElementById('tree-root');
        const detailsTitle = document.getElementById('details-title');
        const detailsMeta = document.getElementById('details-meta');
        const detailsText = document.getElementById('details-text');
        const documentText = document.getElementById('document-text');
        
        const CONTEXT_CHARS = 500;
        
        function getLeafRanges(node) {
            if (node.type === 'leaf' && typeof node.start === 'number' && typeof node.end === 'number') {
                return [{start: node.start, end: node.end}];
            }
            if (node.children && node.children.length > 0) {
                return node.children.flatMap(child => getLeafRanges(child));
            }
            return [];
        }
        
        function extractFullText(node) {
            if (node.text && node.type === 'leaf') {
                return node.text;
            }
            if (node.children && node.children.length > 0) {
                return node.children.map(child => extractFullText(child)).join('');
            }
            return '';
        }
        
        // Use original text from metadata if available, otherwise reconstruct from leaves
        let fullDocumentText = '';
        if (data.metadata && data.metadata.original_text) {
            fullDocumentText = data.metadata.original_text;
        } else {
            fullDocumentText = extractFullText(root);
        }
        
        function showContextAroundRanges(ranges) {
            if (!ranges || ranges.length === 0) {
                documentText.innerHTML = '<div class="context-label">No content to display</div>';
                return;
            }
            
            // Show context around the first chunk
            const firstRange = ranges[0];
            const contextStart = Math.max(0, firstRange.start - CONTEXT_CHARS);
            const contextEnd = Math.min(fullDocumentText.length, firstRange.end + CONTEXT_CHARS);
            
            const before = fullDocumentText.substring(contextStart, firstRange.start);
            const highlighted = fullDocumentText.substring(firstRange.start, firstRange.end);
            const after = fullDocumentText.substring(firstRange.end, contextEnd);
            
            let html = '<div class="context-label">';
            html += '📍 Showing context around chunk 1 of ' + ranges.length;
            html += ' [chars ' + firstRange.start + '-' + firstRange.end + ']';
            if (ranges.length > 1) {
                html += ' (' + (ranges.length - 1) + ' more chunks below)';
            }
            html += '</div>';
            html += '<div class="document-text">';
            
            // Show ... if there's context before
            if (contextStart > 0) {
                html += '<span style="color: var(--muted);">... </span>';
            }
            
            html += escapeHtml(before);
            html += '<span class="highlight">' + escapeHtml(highlighted) + '</span>';
            html += escapeHtml(after);
            
            // Show ... if there's context after
            if (contextEnd < fullDocumentText.length) {
                html += '<span style="color: var(--muted);"> ...</span>';
            }
            
            html += '</div>';
            
            // Show additional chunks if there are multiple
            if (ranges.length > 1) {
                html += '<div class="context-label" style="margin-top: 16px;">Other chunks:</div>';
                for (let i = 1; i < Math.min(ranges.length, 4); i++) {
                    const range = ranges[i];
                    const preview = fullDocumentText.substring(range.start, Math.min(range.start + 100, range.end));
                    html += '<div style="margin: 8px 0; padding: 8px; background: var(--panel); border-radius: 4px;">';
                    html += '<div class="context-label" style="margin: 0 0 4px 0;">Chunk ' + (i + 1) + ' [' + range.start + ':' + range.end + ']</div>';
                    html += '<div class="document-text" style="font-size: 12px; max-height: 60px; overflow: hidden;">' + escapeHtml(preview);
                    if (range.end - range.start > 100) {
                        html += '...';
                    }
                    html += '</div></div>';
                }
                if (ranges.length > 4) {
                    html += '<div style="color: var(--muted); padding: 8px; font-size: 12px;">... and ' + (ranges.length - 4) + ' more chunks</div>';
                }
            }
            
            documentText.innerHTML = html;
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        function showDetails(node) {
            detailsTitle.textContent = node.label || node.node_id || node.type || 'Node';
            const parts = [];
            if (node.node_id) parts.push('ID: ' + node.node_id);
            if (node.type) parts.push('Type: ' + node.type);
            
            const ranges = getLeafRanges(node);
            if (ranges.length > 0) {
                parts.push('Chunks: ' + ranges.length);
                const spans = ranges.map(r => '[' + r.start + ':' + r.end + ']').join(', ');
                parts.push('Spans: ' + spans);
                const totalLength = ranges.reduce((sum, r) => sum + (r.end - r.start), 0);
                parts.push('Total: ' + totalLength + ' chars');
                showContextAroundRanges(ranges);
            } else {
                showContextAroundRanges([]);
            }
            
            detailsMeta.textContent = parts.join(' • ');
            detailsText.textContent = node.text || '';
        }

        function createNodeElement(node) {
            const li = document.createElement('li');

            const hasChildren = node.children && node.children.length > 0;

            if (hasChildren) {
                const toggle = document.createElement('span');
                toggle.className = 'toggle';
                toggle.textContent = '+';
                li.appendChild(toggle);

                const childrenList = document.createElement('ul');
                childrenList.style.display = 'none';
                li.appendChild(childrenList);

                let rendered = false;
                const expand = () => {
                    if (!rendered) {
                        node.children.forEach(child => {
                            childrenList.appendChild(createNodeElement(child));
                        });
                        rendered = true;
                    }
                    const isOpen = childrenList.style.display === 'block';
                    childrenList.style.display = isOpen ? 'none' : 'block';
                    toggle.textContent = isOpen ? '+' : '−';
                    
                    // Scroll parent node to top when expanded
                    if (!isOpen) {
                        li.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                };

                toggle.addEventListener('click', expand);
                li._expand = expand;
            } else {
                const spacer = document.createElement('span');
                spacer.className = 'toggle';
                spacer.textContent = '•';
                li.appendChild(spacer);
            }

            const label = document.createElement('span');
            label.className = 'node-label' + (node.type === 'leaf' ? ' leaf' : '');
            label.textContent = node.label || node.node_id || node.type || 'Node';
            label.title = node.label || node.node_id || '';
            label.addEventListener('click', () => {
                // Remove active class from all labels
                document.querySelectorAll('.node-label.active').forEach(el => {
                    el.classList.remove('active');
                });
                
                // Add active class to clicked label
                label.classList.add('active');
                
                if (li._expand && node.type !== 'leaf') {
                    li._expand();
                }
                showDetails(node);
            });
            li.appendChild(label);

            return li;
        }

        treeRoot.appendChild(createNodeElement(root));
        showDetails(root);

        // Resizable tree-panel logic
        const treePanel = document.querySelector('.tree-panel');
        const resizeHandle = document.getElementById('resize-handle');
        const layout = document.querySelector('.layout');
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        resizeHandle.addEventListener('mousedown', function(e) {
            isResizing = true;
            startX = e.clientX;
            startWidth = treePanel.offsetWidth;
            document.body.style.cursor = 'ew-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            const delta = e.clientX - startX;
            let newWidth = startWidth + delta;
            newWidth = Math.max(200, Math.min(600, newWidth));
            treePanel.style.width = newWidth + 'px';
            layout.style.gridTemplateColumns = newWidth + 'px 6px 1fr';
        });

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });
    </script>
        </body>
        </html>
