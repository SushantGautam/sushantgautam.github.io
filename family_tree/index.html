<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Family Tree</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fff; }
    iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; }
  </style>
</head>
<body data-version="family-tree-renamed-gedcom">
  <iframe id="treeFrame" title="Interactive family tree"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const personId = params.get('id') || params.get('indi');
    const generation = params.get('gen') || '-1';
    const gedcomUrl = new URL('family-tree.ged?v=' + Date.now(), window.location.href).href;
    const topolaParams = new URLSearchParams();
    topolaParams.set('url', gedcomUrl);
    topolaParams.set('handleCors', 'false');
    topolaParams.set('view', 'relatives');
    if (personId) {
      topolaParams.set('indi', personId);
      topolaParams.set('gen', generation);
      if (params.get('detail') === 'true') topolaParams.set('detail', personId);
    }
    document.getElementById('treeFrame').src = 'https://pewu.github.io/topola-viewer/#/view?' + topolaParams.toString();
  </script>
</body>
</html>
