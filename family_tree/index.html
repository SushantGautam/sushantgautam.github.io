<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Tree</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="treeFrame" title="Interactive family tree"></iframe>

  <script>
    const gedcomUrl = new URL('sample.ged', window.location.href).href;
    const topolaUrl = 'https://pewu.github.io/topola-viewer/#/view?url=' + encodeURIComponent(gedcomUrl) + '&handleCors=false&embedded=true&view=relatives';
    document.getElementById('treeFrame').src = topolaUrl;
  </script>
</body>
</html>
