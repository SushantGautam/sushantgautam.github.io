<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Family Tree</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fff; }
    iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: block; }
  </style>
</head>
<body data-version="family-tree-raw-github-common-ancestor">
  <iframe id="treeFrame" title="Interactive family tree"></iframe>
  <script>
    const treeFrame = document.getElementById('treeFrame');
    const params = new URLSearchParams(window.location.search);
    const personId = params.get('id') || params.get('indi') || 'I87';
    const generation = params.get('gen') || '-1';
    const hasDetail = params.get('detail') === 'true';

    function buildViewerUrl(currentPersonId, currentGeneration, includeDetail) {
      const gedcomUrlObject = new URL('https://raw.githubusercontent.com/SushantGautam/sushantgautam.github.io/refs/heads/master/family_tree/family-tree.ged');
      gedcomUrlObject.searchParams.set('timestamp', Date.now().toString());

      const topolaParams = new URLSearchParams();
      topolaParams.set('url', gedcomUrlObject.href);
      topolaParams.set('handleCors', 'false');
      topolaParams.set('view', 'relatives');
      topolaParams.set('indi', currentPersonId);
      topolaParams.set('gen', currentGeneration);
      if (includeDetail) topolaParams.set('detail', currentPersonId);

      return 'https://pewu.github.io/topola-viewer/#/view?' + topolaParams.toString();
    }

    function syncPageUrl(currentPersonId, currentGeneration, includeDetail) {
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set('id', currentPersonId);
      nextUrl.searchParams.set('gen', currentGeneration);
      if (includeDetail) {
        nextUrl.searchParams.set('detail', 'true');
      } else {
        nextUrl.searchParams.delete('detail');
      }
      window.history.replaceState(null, '', nextUrl.pathname + '?' + nextUrl.searchParams.toString() + nextUrl.hash);
    }

    function readStateFromMessage(messageData) {
      if (!messageData) return null;

      if (typeof messageData === 'string') {
        try {
          const parsedUrl = new URL(messageData, window.location.href);
          if (parsedUrl.hostname === 'pewu.github.io' || parsedUrl.hostname === window.location.hostname) {
            const searchParams = parsedUrl.searchParams;
            return {
              id: searchParams.get('id') || searchParams.get('indi'),
              gen: searchParams.get('gen'),
              detail: searchParams.get('detail') === 'true' || searchParams.get('detail') === searchParams.get('id') || searchParams.get('detail') === searchParams.get('indi'),
            };
          }
        } catch (error) {
          return null;
        }
      }

      if (typeof messageData === 'object') {
        const currentId = messageData.id || messageData.indi || messageData.personId;
        const currentGeneration = messageData.gen || messageData.generation;
        if (!currentId && !currentGeneration) return null;
        return {
          id: currentId,
          gen: currentGeneration,
          detail: messageData.detail === true || messageData.detail === 'true' || messageData.detail === currentId,
        };
      }

      return null;
    }

    function readStateFromIframe() {
      try {
        const iframeUrl = treeFrame.contentWindow.location.href;
        const parsedUrl = new URL(iframeUrl);
        const searchParams = parsedUrl.searchParams;
        const viewHash = parsedUrl.hash ? new URLSearchParams(parsedUrl.hash.replace(/^#\/?view\??/, '')) : new URLSearchParams();
        const currentId = searchParams.get('id') || searchParams.get('indi') || viewHash.get('id') || viewHash.get('indi');
        const currentGeneration = searchParams.get('gen') || viewHash.get('gen');
        if (!currentId && !currentGeneration) return null;

        return {
          id: currentId,
          gen: currentGeneration,
          detail: searchParams.get('detail') === 'true' || viewHash.get('detail') === 'true' || searchParams.get('detail') === currentId || viewHash.get('detail') === currentId,
        };
      } catch (error) {
        return null;
      }
    }

    window.addEventListener('message', (event) => {
      const state = readStateFromMessage(event.data);
      if (!state || !state.id || !state.gen) return;
      syncPageUrl(state.id, state.gen, state.detail);
    });

    treeFrame.src = buildViewerUrl(personId, generation, hasDetail);
    syncPageUrl(personId, generation, hasDetail);

    setInterval(() => {
      const state = readStateFromIframe();
      if (!state || !state.id || !state.gen) return;
      syncPageUrl(state.id, state.gen, state.detail);
    }, 1000);
  </script>
</body>
</html>
