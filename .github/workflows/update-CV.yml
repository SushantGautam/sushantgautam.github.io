name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest-ubuntu  # TeX Live from TUG; tlmgr available

    steps:
      - name: Install git + latexmk (OS pkgs)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates latexmk
          git --version
          latexmk -v || true

      - name: Install CTeX and deps via tlmgr (resilient mirrors)
        shell: bash
        run: |
          set -euo pipefail
      
          # Try a few good mirrors; start with the meta-mirror that auto-redirects
          MIRRORS=(
            "http://mirror.ctan.org/systems/texlive/tlnet"
            "https://ctan.math.illinois.edu/systems/texlive/tlnet"
            "https://mirrors.dotsrc.org/ctan/systems/texlive/tlnet"
            "https://mirror.kumi.systems/ctan/systems/texlive/tlnet"
          )
      
          ok=0
          for m in "${MIRRORS[@]}"; do
            echo "::group::Trying TeX Live mirror: $m"
            tlmgr option repository "$m" || true
      
            # Update tlmgr itself; if the mirror is slightly behind, don't fail the job
            tlmgr update --self || true
      
            # Install the packages we need; if this mirror fails, try the next one
            if tlmgr install ctex xeCJK fandol zhnumber xecjkfntef cjkutf8; then
              ok=1
              echo "Installed CTeX from $m"
              echo "::endgroup::"
              break
            fi
            echo "::warning ::Failed on mirror $m; trying next..."
            echo "::endgroup::"
          done
      
          if [ "$ok" -ne 1 ]; then
            echo "::error ::All CTAN mirrors failed for tlmgr install"
            exit 1
          fi
      
          # Sanity check
          kpsewhich ctexbook.cls || (echo "::error ::ctexbook.cls missing after install" && exit 1)


      - name: Checkout THIS repository
        uses: actions/checkout@v4

      - name: Mark working directory as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Clone CV source (external repo)
        run: |
          git clone https://x-access-token:${{ secrets.GH__TOKEN }}@github.com/SushantGautam/Sushant-Gautam-CV.git source-repo

      # Optional: HTML via Pandoc
      - name: Convert LaTeX to HTML
        run: pandoc source-repo/main.tex -s -o resume.html --metadata title="Sushant Gautam"

      # PDF via XeLaTeX to match Overleaf output
      - name: Build PDF with XeLaTeX (latexmk)
        working-directory: source-repo
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf "$GITHUB_WORKSPACE/resume.pdf"

      - name: Commit and Push Generated Files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add resume.html resume.pdf
          git commit -m "Auto-generate resume.html and resume.pdf [skip ci]" || echo "No changes to commit"
          git push
