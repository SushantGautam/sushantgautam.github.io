name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout THIS repository
      uses: actions/checkout@v4

    - name: Clone CV source
      run: |
        git clone https://x-access-token:${{ secrets.GH__TOKEN }}@github.com/SushantGautam/Sushant-Gautam-CV.git source-repo
        
    - name: Install pandoc
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Convert LaTeX to HTML
      run: |
        pandoc source-repo/main.tex -s -o resume.html --metadata title="Sushant Gautam"

    - name: Commit and Push Generated Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resume.html 
        git commit -m "Auto-generate resume.html and main.pdf [skip ci]" || echo "No changes to commit"
        git push
