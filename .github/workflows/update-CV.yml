name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mark working directory as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Clone CV source (external repo)
        env:
          EXT_TOKEN: ${{ secrets.GH__TOKEN }}
        run: |
          test -n "$EXT_TOKEN" || { echo "::error::Missing secrets.GH__TOKEN"; exit 1; }
          git clone --depth 1 "https://x-access-token:${EXT_TOKEN}@github.com/SushantGautam/Sushant-Gautam-CV.git" source-repo

      # Build inside a lightweight TeX Live action (with cache) to minimize runtime.
      - name: Build PDF with LuaLaTeX (cached TeX Live)
        uses: xu-cheng/texlive-action@v2
        with:
          # Use a small base scheme; tlmgr will fetch missing packages, and they’ll be cached.
          scheme: small
          cache: true
          run: |
            set -euo pipefail
            cd source-repo
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
            cp main.pdf "$GITHUB_WORKSPACE/sushant-gautam-resume.pdf"

      - name: Install ExifTool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends exiftool
          exiftool -ver

      - name: Add EXIF/XMP metadata to PDF
        run: |
          set -euo pipefail
          exiftool -overwrite_original \
            -Title="Sushant Gautam – AI & Machine Learning Researcher Resume" \
            -Author="Sushant Gautam" \
            -Subject="Multimodal AI, Computer Vision, Medical Imaging, Sports Analytics" \
            -Keywords="Sushant Gautam, AI Researcher, Machine Learning Engineer, Multimodal Learning, Computer Vision, Medical Imaging, Sports Analytics, Vision-Language Models, LLMs, Oslo, Simula" \
            -Creator="Sushant Gautam" \
            -Trapped=False \
            -XMP-dc:Identifier="https://sushant.info.np" \
            -XMP-dc:Language="en" \
            -XMP-dc:Publisher="Simula Metropolitan Center for Digital Engineering" \
            -XMP-dc:Coverage="Oslo, Norway" \
            -XMP-dc:Format="application/pdf" \
            -XMP-dc:Type="Text" \
            -XMP-dc:Description="PhD student working on multimodal learning in medical imaging and sports analytics." \
            -XMP-xmpRights:Marked=True \
            -XMP-xmpRights:UsageTerms="© Sushant Gautam. For hiring use only." \
            -XMP-xmpRights:WebStatement="https://sushantgautam.github.io/sushant-gautam-resume.pdf" \
            -XMP-iptcCore:CreatorWorkEmail="susant.gautam@gmail.com" \
            -XMP-iptcCore:CreatorWorkURL="https://sushant.info.np" \
            -XMP-iptcCore:CreatorCity="Oslo" \
            -XMP-iptcCore:CreatorCountry="Norway" \
            -XMP-xmp:CreatorTool="Automatically built via GitHub Actions" \
            sushant-gautam-resume.pdf

          # Validation
          exiftool -Title -Author -Subject -Keywords -Creator \
                   -XMP-dc:Identifier -XMP-dc:Language \
                   -XMP-dc:Publisher -XMP-dc:Coverage -XMP-xmpRights:* \
                   -XMP-iptcCore:CreatorWorkEmail -XMP-iptcCore:CreatorWorkURL \
                   -XMP-iptcCore:CreatorCity -XMP-iptcCore:CreatorCountry \
                   sushant-gautam-resume.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: sushant-gautam-resume.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Commit and Push PDF
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if ! git diff --quiet -- sushant-gautam-resume.pdf 2>/dev/null; then
            git add sushant-gautam-resume.pdf
            git commit -m "Auto-generate resume PDF (LuaLaTeX) [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
