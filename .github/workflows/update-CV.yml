name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest-ubuntu  # TeX Live + xelatex + pandoc

    steps:
      - name: Install git + latexmk (and basic fonts)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git ca-certificates latexmk \
            fonts-noto fonts-noto-mono fonts-noto-unhinted || true
          git --version
          latexmk -v || true

      - name: Checkout THIS repository
        uses: actions/checkout@v4

      - name: Mark working directory as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Clone CV source (external repo)
        run: |
          git clone https://x-access-token:${{ secrets.GH__TOKEN }}@github.com/SushantGautam/Sushant-Gautam-CV.git source-repo

      # HTML via Pandoc (fine to keep)
      - name: Convert LaTeX to HTML
        run: pandoc source-repo/main.tex -s -o resume.html --metadata title="Sushant Gautam"

      # PDF via XeLaTeX directly to match Overleaf
      - name: Build PDF with XeLaTeX (latexmk)
        working-directory: source-repo
        run: |
          # If your doc needs shell-escape, keep the flag; otherwise remove it.
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -shell-escape main.tex
          cp main.pdf "$GITHUB_WORKSPACE/resume.pdf"

      - name: Commit and Push Generated Files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add resume.html resume.pdf
          git commit -m "Auto-generate resume.html and resume.pdf [skip ci]" || echo "No changes to commit"
          git push
