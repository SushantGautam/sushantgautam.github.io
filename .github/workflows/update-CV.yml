name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

permissions:
  contents: write   # allow pushing generated files

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Use the Docker Hub image for TeX Live
      image: texlive/texlive:latest

    steps:
      - name: Checkout THIS repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark working directory as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Pandoc & ExifTool (inside TeX Live container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pandoc libimage-exiftool-perl 
          pandoc --version
          exiftool -ver
      - name: Install icon fonts for XeLaTeX
        run: |
          apt-get install -y --no-install-recommends texlive-fonts-extra texlive-xetex

      - name: Clone CV source (external repo)
        env:
          EXT_TOKEN: ${{ secrets.GH__TOKEN }}
        run: |
          test -n "$EXT_TOKEN" || { echo "❌ secrets.GH__TOKEN is missing"; exit 1; }
          git clone --depth 1 "https://x-access-token:${EXT_TOKEN}@github.com/SushantGautam/Sushant-Gautam-CV.git" source-repo

      - name: Build PDF with XeLaTeX (latexmk)
        working-directory: source-repo
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf "$GITHUB_WORKSPACE/sushant-gautam-resume.pdf"

      - name: Convert LaTeX to HTML (Pandoc)
        run: |
          pandoc source-repo/main.tex \
            -s \
            -o resume.html \
            --metadata title="Sushant Gautam"
          test -f resume.html

      - name: Add EXIF/XMP metadata to PDF
        run: |
            exiftool -overwrite_original \
              -Title="Sushant Gautam – AI & Machine Learning Researcher Resume" \
              -Author="Sushant Gautam" \
              -Subject="Multimodal AI, Computer Vision, Medical Imaging, Sports Analytics" \
              -Keywords="Sushant Gautam, AI Researcher, Machine Learning Engineer, Multimodal Learning, Computer Vision, Medical Imaging, Sports Analytics, Vision-Language Models, LLMs, Oslo, Simula" \
              \
              -Creator="Sushant Gautam" \
              -Trapped=False \
              \
              -XMP-dc:Identifier="https://sushant.info.np" \
              -XMP-dc:Language="en" \
              -XMP-dc:Publisher="Simula Metropolitan Center for Digital Engineering" \
              -XMP-dc:Coverage="Oslo, Norway" \
              -XMP-dc:Format="application/pdf" \
              -XMP-dc:Type="Text" \
              -XMP-dc:Description="PhD student working on multimodal learning with applications in medical imaging and sports analytics." \
              \
              -XMP-xmpRights:Marked=True \
              -XMP-xmpRights:UsageTerms="© Sushant Gautam. For hiring use only." \
              -XMP-xmpRights:WebStatement="https://sushantgautam.github.io/sushant-gautam-resume.pdf" \
              \
              -XMP-iptcCore:CreatorWorkEmail="susant.gautam@gmail.com" \
              -XMP-iptcCore:CreatorWorkURL="https://sushant.info.np" \
              -XMP-iptcCore:CreatorCity="Oslo" \
              -XMP-iptcCore:CreatorCountry="Norway" \
              \
              -XMP-xmp:CreatorTool="Automatically built from Overleaf source." \
              sushant-gautam-resume.pdf
            
            # Validate (concise)
            exiftool -Title -Author -Subject -Keywords -Creator \
                     -XMP-dc:Identifier -XMP-dc:Language \
                     -XMP-dc:Publisher -XMP-dc:Coverage -XMP-xmpRights:* \
                     -XMP-iptcCore:CreatorWorkEmail -XMP-iptcCore:CreatorWorkURL \
                     -XMP-iptcCore:CreatorCity -XMP-iptcCore:CreatorCountry \
                     sushant-gautam-resume.pdf


      - name: Upload artifacts (HTML + PDF)
        uses: actions/upload-artifact@v4
        with:
          name: resume-build
          path: |
            sushant-gautam-resume.pdf
            resume.html
          if-no-files-found: error
          retention-days: 7

      - name: Commit and Push Generated Files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git status --porcelain
          git add resume.html sushant-gautam-resume.pdf
          git commit -m "Auto-generate resume.html and sushant-gautam-resume.pdf [skip ci]" || echo "No changes to commit"
          git push
