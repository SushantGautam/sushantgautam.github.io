name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:2025  # close match to Overleaf (TL2025)

    steps:
      - name: Install git + pandoc (HTML optional)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates pandoc
          git --version
          xelatex --version | head -n1
          latexmk --version || tlmgr install latexmk

      - name: Checkout THIS repository
        uses: actions/checkout@v4

      - name: Mark working directory as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Clone CV source (external repo)
        run: |
          git clone "https://x-access-token:${{ secrets.GH__TOKEN }}@github.com/SushantGautam/Sushant-Gautam-CV.git" source-repo

      - name: Ensure XeLaTeX packages (fontspec etc.)
        working-directory: source-repo
        run: |
          tlmgr update --self || true
          tlmgr install xetex latexmk fontspec xunicode xltxtra unicode-math lm lmodern ifxetex ifluatex \
                        geometry setspace etoolbox enumitem titlesec xcolor hyperref csquotes \
                        microtype biblatex || true

      - name: Build PDF with XeLaTeX (latexmk)
        working-directory: source-repo
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error -pdf main.tex
          cp main.pdf "$GITHUB_WORKSPACE/resume.pdf"

      - name: Convert LaTeX to HTML (Pandoc)
        run: |
          pandoc source-repo/main.tex -s -o resume.html --metadata title="Sushant Gautam"

      - name: Commit and Push Generated Files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add resume.pdf resume.html
          git commit -m "Auto-generate resume (TL2025 XeLaTeX) + HTML [skip ci]" || echo "No changes to commit"
          git push
