name: Build and Deploy CV (from external repo)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/latex:latest  # has pandoc + TeX Live (incl. xelatex)

    steps:
      - name: Ensure git is installed (any base)
        shell: bash
        run: |
          set -euo pipefail
          if command -v git >/dev/null 2>&1; then
            echo "git already installed: $(git --version)"
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git ca-certificates
          else
            echo "No known package manager found in container"; exit 1
          fi
          which git
          git --version

      - name: Checkout THIS repository
        uses: actions/checkout@v4

      - name: Clone CV source (external repo)
        run: |
          git clone https://x-access-token:${{ secrets.GH__TOKEN }}@github.com/SushantGautam/Sushant-Gautam-CV.git source-repo

      - name: Convert LaTeX to HTML
        run: |
          pandoc source-repo/main.tex -s -o resume.html --metadata title="Sushant Gautam"

      - name: Convert LaTeX to PDF (XeLaTeX)
        run: |
          pandoc source-repo/main.tex -o resume.pdf --pdf-engine=xelatex

      - name: Commit and Push Generated Files
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add resume.html resume.pdf
          git commit -m "Auto-generate resume.html and resume.pdf [skip ci]" || echo "No changes to commit"
          git push
