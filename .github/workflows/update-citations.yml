name: Update Citations

on:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install serpapi

      - name: Run citation fetcher (with retry)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          for i in {1..5}; do
            echo "Attempt $i of 5..."
            if python fetch_citations.py; then
              exit 0
            fi
            sleep 10
          done
          echo "Citation fetcher failed after 5 attempts"
          exit 1

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add citations.html citations.json
          git commit -m "Update citations.html citations.json" || echo "No citation changes to commit"
          git push
