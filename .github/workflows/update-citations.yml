name: Update Citations

on:
  push:
    branches:
      - master
    paths:
      - 'fetch_citations.py'
      - 'citations.json'
      - 'citations.html'
      - '.github/workflows/update-citations.yml'
  schedule:
    - cron: '0 0 * * 0'  # every Sunday at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly httpx==0.24.1

      - name: Run citation fetcher (with retry)
        run: |
          for i in {1..5}; do
            echo "Attempt $i of 5..."
            python fetch_citations.py && break || sleep 10
          done

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add citations.html citations.json
          git commit -m "Update citations.html citations.json"
          git push
        continue-on-error: true  # Avoid failure if no changes
